# Predefined joint angle definitions (three-point angles)
# format: [proximal_point, vertex_point, distal_point]
angle_definitions:
  left_knee_angle: [23, 25, 27]     # hip-knee-ankle
  right_knee_angle: [24, 26, 28]    # hip-knee-ankle
  left_elbow_angle: [11, 13, 15]    # shoulder-elbow-wrist
  right_elbow_angle: [12, 14, 16]   # shoulder-elbow-wrist
  left_hip_angle: [11, 23, 25]      # shoulder-hip-knee
  right_hip_angle: [12, 24, 26]     # shoulder-hip-knee
  left_shoulder_angle: [13, 11, 23] # elbow-shoulder-hip
  right_shoulder_angle: [14, 12, 24] # elbow-shoulder-hip
  left_ankle_angle: [25, 27, 31]    # knee-ankle-foot_index
  right_ankle_angle: [26, 28, 32]   # knee-ankle-foot_index

# Bone connections for visualization (index pairs)
connections:
  - [11, 12]  # shoulders
  - [11, 23]  # left torso
  - [12, 24]  # right torso
  - [23, 24]  # hips
  - [11, 13]  # left upper arm
  - [13, 15]  # left forearm
  - [12, 14]  # right upper arm
  - [14, 16]  # right forearm
  - [23, 25]  # left thigh
  - [25, 27]  # left shin
  - [24, 26]  # right thigh
  - [26, 28]  # right shin
  - [15, 17]  # left hand
  - [15, 19]  # left hand
  - [16, 18]  # right hand
  - [16, 20]  # right hand
  - [17, 19]  # left hand
  - [18, 20]  # right hand
  - [27, 29]  # left foot
  - [27, 31]  # left foot
  - [28, 30]  # right foot
  - [28, 32]  # right foot
  - [29, 31]  # left foot
  - [30, 32]  # right foot
